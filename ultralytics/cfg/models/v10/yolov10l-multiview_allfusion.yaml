# YOLOv10l-Multiview object detection model with fusion at P3, P4, and P5
# Applies MultiviewFusionBlock at all three FPN scales for cross-view feature fusion

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4 (P3 backbone output)
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6 (P4)
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2fCIB, [1024, True]] # 8 (P5)
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 1, PSA, [1024]] # 10

head:
  # Standard FPN top-down pathway
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 3, C2fCIB, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 3, C2f, [256]] # 16 (P3/8-small)
  - [-1, 1, MultiviewFusionBlock, [256,1]] # 17 (Fused P3)

  # FPN bottom-up pathway with fusion at P4 and P5
  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13], 1, Concat, [1]] # 19 cat head P4
  - [-1, 3, C2fCIB, [512, True]] # 20 (P4/16-medium)
  - [-1, 1, MultiviewFusionBlock, [512,1]] # 21 (Fused P4)

  - [-1, 1, SCDown, [512, 3, 2]] # 22
  - [[-1, 10], 1, Concat, [1]] # 23 cat head P5
  - [-1, 3, C2fCIB, [1024, True]] # 24 (P5/32-large)
  - [-1, 1, MultiviewFusionBlock, [1024,1]] # 25 (Fused P5)

  - [[17, 21, 25], 1, v10Detect, [nc]] # 26 Detect(P3, P4, P5)
