# YOLOv10l-Video-VSA-Lite (Memory Optimized)
# Reduced max_memory and global_topk for lower VRAM usage.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  l: [1.00, 1.00, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2 (P2 for Head)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  
  # === VSA Memory Attention (P3) - LITE VERSION ===
  # args: [d_model=256, max_memory=16, global_topk=256]
  # max_memory=16: For T=8 training, 16 is more than enough
  # global_topk=256: Reduced from 512 to save memory
  - [-1, 1, VSAMemoryAttention, [256, 16, 256]] # 4
  
  - [-1, 6, C2f, [256, True]] # 5 (P3 for Head)
  - [-1, 1, SCDown, [512, 3, 2]] # 6-P4/16
  - [-1, 6, C2f, [512, True]] # 7 (P4 for Head)
  - [-1, 1, SCDown, [1024, 3, 2]] # 8-P5/32
  - [-1, 3, C2fCIB, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 1, PSA, [1024]] # 11

# YOLOv10l-P2-no-P5 head (Indices Shifted)
head:
  # --- Upsample to P4 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13 cat backbone P4 (Index 7)
  - [-1, 3, C2fCIB, [512, True]] # 14

  # --- Upsample to P3 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat backbone P3 (Index 5)
  - [-1, 3, C2f, [256]] # 17 (P3/8)

  # --- Upsample to P2 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 2], 1, Concat, [1]] # 19 cat backbone P2 (Index 2)
  - [-1, 3, C2f, [128]] # 20 (P2/4-tiny)

  # --- Downsample back to P3 ---
  - [-1, 1, Conv, [128, 3, 2]] # 21
  - [[-1, 17], 1, Concat, [1]] # 22 cat head P3
  - [-1, 3, C2f, [256]] # 23 (P3/8-small)

  # --- Downsample back to P4 ---
  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 14], 1, Concat, [1]] # 25 cat head P4
  - [-1, 3, C2fCIB, [512, True]] # 26 (P4/16-medium)

  # --- Detect (P2, P3, P4) ---
  - [[20, 23, 26], 1, v10Detect, [nc]] # Detect(P2, P3, P4)

