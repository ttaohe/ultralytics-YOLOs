# YOLO12-Video object detection model with P2-P4 outputs, using P5 context.
# Strictly follows YOLO12 architecture (Conv, C3k2, A2C2f) without YOLOv10 mixins.
# Optimized for small object detection (VisDrone) by including P2.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] 
  s: [0.50, 0.50, 1024] 
  m: [0.50, 1.00, 512] 
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.50, 512] 

# YOLO12 Backbone (Matches yolo12.yaml)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6 (P4/16)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8 (P5/32) - Official YOLO12 uses A2C2f here

# YOLO12 Head (P5 -> P4 -> P3 -> P2 -> P3 -> P4)
head:
  # --- Upsample P5 to P4 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11 (P4 Neck)

  # --- Upsample P4 to P3 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14 (P3 Neck)

  # --- Upsample P3 to P2 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 2], 1, Concat, [1]] # 16 cat backbone P2
  - [-1, 2, A2C2f, [256, False, -1]] # 17 (P2 Neck)

  # --- Downsample P2 to P3 ---
  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P3
  - [-1, 2, A2C2f, [256, False, -1]] # 20 (P3 Output)

  # Apply Memory Attention to P3
  - [-1, 1, YOLOMemoryAttention, [256]] # 21 (Attended P3)

  # --- Downsample P3 to P4 ---
  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 11], 1, Concat, [1]] # 23 cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 24 (P4 Output)

  # Apply Memory Attention to P4
  - [-1, 1, YOLOMemoryAttention, [512]] # 25 (Attended P4)

  # --- Detect (P2, P3, P4) ---
  - [[17, 21, 25], 1, Detect, [nc]] # Detect(P2, P3, P4)
