# YOLO12 object detection model with P2/4 - P4/16 outputs (no P5)
# Optimized for small object detection (VisDrone), removing P5 (large object) head.
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 272 layers, 2,602,288 parameters, 2,602,272 gradients, 6.7 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 272 layers, 9,284,096 parameters, 9,284,080 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 292 layers, 20,199,168 parameters, 20,199,152 gradients, 68.1 GFLOPs
  l: [1.00, 1.00, 512] # summary: 488 layers, 26,450,784 parameters, 26,450,768 gradients, 89.7 GFLOPs
  x: [1.00, 1.50, 512] # summary: 488 layers, 59,210,784 parameters, 59,210,768 gradients, 200.3 GFLOPs

# YOLO12n backbone (stops at P4/16, no P5)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6 (P4/16)

# ... (参数部分保持不变)

# YOLO12n-Video for VisDrone (Revised)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (P2)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  
  # === 策略：Memory Attention 下沉到 P3 ===
  # 这里的输出通道是 256
  # args: [d_model=256, max_memory=8, topk_ratio=0.25]
  - [-1, 1, SparseMemoryAttention, [256, 8, 0.25]] # 4 (P3 + Sparse Memory)
  
  - [-1, 2, C3k2, [512, False, 0.25]] # 5 (P3 C3k2) -> 注意这里原本是 layer 4
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16 (原本是 layer 5)
  - [-1, 4, A2C2f, [512, True, 4]] # 7 (P4/16) (原本是 layer 6)
  
head:
  # --- Upsample to P3 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 8
  # Cat Backbone P3. P3 is now Layer 4 (SparseMemory Output)
  - [[-1, 4], 1, Concat, [1]] # 9 cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 10 (P3 Neck)

  # --- Upsample to P2 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 2], 1, Concat, [1]] # 12 cat backbone P2
  - [-1, 2, A2C2f, [256, False, -1]] # 13 

  # --- Downsample back to P3 ---
  - [-1, 1, Conv, [256, 3, 2]] # 14
  - [[-1, 10], 1, Concat, [1]] # 15
  - [-1, 2, A2C2f, [256, False, -1]] # 16 (P3 Output)

  # --- Downsample back to P4 ---
  - [-1, 1, Conv, [256, 3, 2]] # 17
  # Cat Backbone P4. P4 is Layer 7
  - [[-1, 7], 1, Concat, [1]] # 18 (Cat Backbone P4)

  - [-1, 2, A2C2f, [512, False, -1]] # 19 (P4 Output)

  # --- Detect (P2, P3, P4) ---
  - [[13, 16, 19], 1, Detect, [nc]]
